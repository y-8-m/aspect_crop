<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aspect Crop</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="toolbar-group toolbar-group-open">
          <button id="open-button" class="icon-button" type="button" data-i18n-aria-label="open" data-i18n-title="open">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l1.8 2H19a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 19 18H5a1.5 1.5 0 0 1-1.5-1.5z"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
              <path
                d="M12 10.5v5M9.5 13h5"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-width="1.8"
              />
            </svg>
          </button>
          <input
            id="file-input"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif,image/bmp"
            multiple
            hidden
          />
        </div>

        <div class="toolbar-group toolbar-group-aspect">
          <div class="ratio-group">
            <select id="ratio-select" data-i18n-aria-label="aspectRatio"></select>
          </div>
          <div id="orientation-toggle" class="orientation-toggle" role="group" data-i18n-aria-label="orientation">
            <button
              id="landscape-orientation-button"
              class="orientation-choice landscape"
              type="button"
              data-i18n-aria-label="landscape"
              data-i18n-title="landscape"
            >
              <span id="landscape-ratio-label" class="orientation-label"></span>
            </button>
            <button
              id="portrait-orientation-button"
              class="orientation-choice portrait"
              type="button"
              data-i18n-aria-label="portrait"
              data-i18n-title="portrait"
            >
              <span id="portrait-ratio-label" class="orientation-label"></span>
            </button>
          </div>
        </div>

        <div class="toolbar-group toolbar-group-size" data-i18n-aria-label="cropSize">
          <input
            id="crop-width-input"
            class="crop-dimension-input"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            data-i18n-aria-label="cropWidth"
            data-i18n-title="cropWidth"
            data-i18n-placeholder="widthPlaceholder"
            disabled
          />
          <span class="crop-dimension-separator" aria-hidden="true">×</span>
          <input
            id="crop-height-input"
            class="crop-dimension-input"
            type="number"
            min="1"
            step="1"
            inputmode="numeric"
            data-i18n-aria-label="cropHeight"
            data-i18n-title="cropHeight"
            data-i18n-placeholder="heightPlaceholder"
            disabled
          />
          <span class="crop-dimension-unit">px</span>
        </div>

        <div class="toolbar-group toolbar-group-actions">
          <button id="preview-button" type="button" disabled data-i18n="preview"></button>
          <button id="save-button" class="icon-button" type="button" disabled data-i18n-aria-label="save" data-i18n-title="save">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M5 4h11l3 3v13H5zM8 4v6h8V4M8 20v-6h8v6"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
            </svg>
          </button>
          <button
            id="add-ratio-button"
            class="icon-button"
            type="button"
            data-i18n-aria-label="settings"
            data-i18n-title="settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
              />
            </svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="canvas-panel" id="drop-zone">
          <div id="editor-viewport" class="zoom-viewport" tabindex="0" data-i18n-aria-label="editorViewport">
            <div id="editor-surface" class="zoom-surface">
              <canvas id="editor-canvas"></canvas>
            </div>
          </div>
          <p class="drop-hint" id="drop-hint" data-i18n="dropHint"></p>
        </section>
        <div id="editor-zoom-controls" class="zoom-controls" role="group" data-i18n-aria-label="editorZoom">
          <label for="editor-zoom" data-i18n="zoom"></label>
          <input id="editor-zoom" type="range" min="0" max="100" value="100" disabled />
          <output id="editor-zoom-value" for="editor-zoom">100%</output>
        </div>
      </main>

      <footer class="status-row">
        <span id="status-text"></span>
        <span id="image-size"></span>
        <span id="crop-size"></span>
      </footer>
    </div>

    <div id="preview-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="preview-modal-title">
      <div class="modal-content preview-modal-content">
        <header class="modal-header">
          <h2 id="preview-modal-title" data-i18n="cropPreview"></h2>
          <button id="close-preview" type="button" data-i18n="close"></button>
        </header>
        <div id="preview-viewport" class="preview-body zoom-viewport" tabindex="0" data-i18n-aria-label="previewViewport">
          <div id="preview-surface" class="zoom-surface">
            <img id="preview-image" data-i18n-alt="cropPreview" />
          </div>
        </div>
        <div id="preview-zoom-controls" class="zoom-controls" role="group" data-i18n-aria-label="previewZoom">
          <label for="preview-zoom" data-i18n="zoom"></label>
          <input id="preview-zoom" type="range" min="0" max="100" value="100" disabled />
          <output id="preview-zoom-value" for="preview-zoom">100%</output>
        </div>
      </div>
    </div>

    <div id="ratio-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="ratio-modal-title">
      <div class="modal-content ratio-modal-content">
        <header class="modal-header">
          <h2 id="ratio-modal-title" data-i18n="settings"></h2>
          <button id="close-ratio-modal" type="button" data-i18n="close"></button>
        </header>
        <div class="ratio-modal-body">
          <label class="settings-field language-field" for="language-select">
            <span data-i18n="language"></span>
            <select id="language-select" data-i18n-aria-label="language">
              <option value="ja" lang="ja" data-i18n="japanese"></option>
              <option value="en" lang="en" data-i18n="english"></option>
            </select>
          </label>
          <section class="settings-section" aria-labelledby="export-format-title">
            <div class="custom-ratio-header">
              <h3 id="export-format-title" data-i18n="export"></h3>
              <p data-i18n="exportDescription"></p>
            </div>
            <label class="settings-field" for="output-format-select">
              <span data-i18n="exportFormat"></span>
              <select id="output-format-select" data-i18n-aria-label="exportFormat">
                <option value="same" data-i18n="sameAsOriginal"></option>
                <option value="png">PNG</option>
                <option value="jpeg">JPEG</option>
                <option value="webp">WebP</option>
                <option value="bmp">BMP</option>
              </select>
            </label>
            <p class="settings-field-help" data-i18n="exportHelp"></p>
          </section>
          <fieldset id="save-folder-settings" class="save-folder-settings">
            <legend data-i18n="saveFolder"></legend>
            <label><input type="radio" name="save-folder-mode" value="source" checked /><span data-i18n="sourceFolder"></span></label>
            <label><input type="radio" name="save-folder-mode" value="last" /><span data-i18n="lastFolder"></span></label>
            <label><input type="radio" name="save-folder-mode" value="custom" /><span data-i18n="customFolder"></span></label>
            <div id="custom-save-folder-row" class="custom-save-folder-row">
              <input id="custom-save-folder" type="text" readonly disabled data-i18n-aria-label="folderPath" data-i18n-placeholder="noFolder" />
              <button id="change-save-folder" type="button" disabled data-i18n="change"></button>
            </div>
            <p id="save-folder-help" class="settings-field-help" aria-live="polite"></p>
          </fieldset>
          <form id="ratio-form" class="ratio-form">
            <p class="ratio-form-copy" data-i18n="ratioFormHelp"></p>
            <div class="ratio-form-grid">
              <label for="ratio-width-input">
                <span data-i18n="width"></span>
                <input id="ratio-width-input" type="number" min="1" max="999" step="1" inputmode="numeric" />
              </label>
              <label for="ratio-height-input">
                <span data-i18n="height"></span>
                <input id="ratio-height-input" type="number" min="1" max="999" step="1" inputmode="numeric" />
              </label>
            </div>
            <p id="ratio-form-error" class="ratio-form-error hidden" aria-live="polite"></p>
            <div class="ratio-form-actions">
              <button id="save-ratio-button" type="submit" data-i18n="addRatio"></button>
            </div>
          </form>
          <section class="custom-ratio-section" aria-labelledby="custom-ratio-title">
            <div class="custom-ratio-header">
              <h3 id="custom-ratio-title" data-i18n="customRatios"></h3>
              <p data-i18n="customRatiosHelp"></p>
            </div>
            <div id="custom-ratio-list" class="custom-ratio-list"></div>
            <p id="custom-ratio-empty" class="custom-ratio-empty hidden" data-i18n="noCustomRatios"></p>
          </section>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
