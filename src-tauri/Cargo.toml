[package]
name = "aspect-crop"
version = "0.1.0"
description = "Fast fixed-aspect image crop utility"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "1.6", features = ["dialog-open", "dialog-save", "window-set-position", "window-set-size"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
